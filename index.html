<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <title>PromptFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">Prompt<span>Flow</span></div>
  <!-- <span class="badge">AI Console v1.0</span> -->
</header>

<main>
  <div class="tagline">Select a prompt.<br /><em>Get AI Response.</em></div>

  <!-- Prompt selector card -->
  <div class="card">
    <!-- <p class="card-label">01 — Choose a Prompt</p> -->
    <div class="select-wrapper">
      <select id="promptSelect">
        <option value="">Loading prompts…</option>
      </select>
    </div>
  </div>
<!-- Progress Stepper -->
  <div class="stepper" id="stepper">
    <div class="stepper-step" id="step-1">
      <div class="stepper-dot"><span class="stepper-icon">01</span></div>
      <div class="stepper-label">Prompt Submitted</div>
    </div>
    <div class="stepper-line" id="line-1"></div>
    <div class="stepper-step" id="step-2">
      <div class="stepper-dot"><span class="stepper-icon">02</span></div>
      <div class="stepper-label">AI Processing</div>
    </div>
    <div class="stepper-line" id="line-2"></div>
    <div class="stepper-step" id="step-3">
      <div class="stepper-dot"><span class="stepper-icon">03</span></div>
      <div class="stepper-label">Response Ready</div>
    </div>
  </div>
  
  <!-- Submit -->
  <div>
    <button class="btn" id="submitBtn" disabled onclick="submitPrompt()">
      <div class="spinner"></div>
      <span class="btn-text">Run Prompt →</span>
    </button>
  </div>

  <!-- Result -->
  <div class="result-wrap" id="resultWrap">
    <div class="card">
      <div class="result-header">
        <!-- <p class="card-label" style="margin:0">02 — AI Response</p> -->
        <div style="display:flex;gap:.5rem;align-items:center">
          <span class="tag" id="statusTag">Success</span>
          <button class="copy-btn" onclick="copyResult()">Copy</button>
        </div>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>
  </div>

  <!-- AWS Pipeline info -->
  <!-- <div class="pipeline">
    <div class="pipeline-header">⚡ Event-Driven AWS Pipeline (Part 2)</div>
    <div class="pipeline-steps">
      <div class="step"><div class="step-dot">S3</div> Upload .txt file</div>
      <span class="step-arrow">→</span>
      <div class="step"><div class="step-dot">λ</div> Lambda triggers</div>
      <span class="step-arrow">→</span>
      <div class="step"><div class="step-dot">λ</div> Reads prompt</div>
      <span class="step-arrow">→</span>
      <div class="step"><div class="step-dot">API</div> Calls backend</div>
      <span class="step-arrow">→</span>
      <div class="step"><div class="step-dot">AI</div> LLM processes</div>
      <span class="step-arrow">→</span>
      <div class="step"><div class="step-dot">S3</div> Saves result</div>
    </div>
  </div> -->

</main>

<footer>
  <!-- <div><span class="status-dot"></span>Backend connected — localhost:8000</div> -->
  <!-- <div>SQLite · FastAPI · Groq (llama-3.1-8b-instant)</div> -->
</footer>

<script src="script.js"></script>
</body>
</html>
