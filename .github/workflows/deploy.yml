name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  test-and-analyse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install analysis tools
        run: |
          npm install eslint @eslint/js globals
          npm install -g htmlhint

      - name: Run JavaScript code analysis (ESLint)
        run: npx eslint script.js

      - name: Run HTML validation (HTMLHint)
        run: htmlhint index.html

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-analyse

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/devops-project-frontend

            if [ -d "/var/www/devops-project-frontend/.git" ]; then
              cd /var/www/devops-project-frontend
              sudo git fetch origin
              sudo git reset --hard origin/main
            else
              sudo git clone https://github.com/muhib99/devops-project-frontend.git /var/www/devops-project-frontend
            fi

            sudo chown -R www-data:www-data /var/www/devops-project-frontend
            sudo chmod -R 755 /var/www/devops-project-frontend
            sudo systemctl restart nginx